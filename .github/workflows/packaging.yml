name: Package Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (without v prefix)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binary:
    name: Build Compositor Binary
    runs-on: ${{ vars.USE_SELFHOSTED == 'true' && 'xoxdwm-nix' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp release version
        run: |
          python3 scripts/stamp-release-version.py "${{ steps.version.outputs.version }}"

      - uses: cachix/install-nix-action@v30
      - uses: ryanccn/attic-action@v0
        if: env.ATTIC_SERVER != ''
        with:
          endpoint: ${{ env.ATTIC_SERVER }}
          cache: ${{ env.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build compositor
        run: nix build .#compositor --out-link result

      - name: Build headless compositor
        run: nix build .#compositor-headless --out-link result-headless

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compositor-binaries
          path: |
            result/bin/ewwm-compositor
            result-headless/bin/ewwm-compositor
          retention-days: 1

  package-rpm:
    name: Package RPM (rpmbuild)
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:10
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install rpmbuild dependencies
        run: |
          dnf install -y 'dnf-command(config-manager)' epel-release
          dnf config-manager --set-enabled crb
          dnf install -y bash rpm-build rpmdevtools gcc make cpio binutils \
            rust cargo pkgconfig \
            wayland-devel mesa-libEGL-devel mesa-libgbm-devel \
            libinput-devel libxkbcommon-devel libdrm-devel \
            libseat-devel libxcb-devel xcb-util-wm-devel \
            systemd-devel \
            emacs tar gzip

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp release version
        run: |
          python3 scripts/stamp-release-version.py "${{ steps.version.outputs.version }}"

      - name: Generate vendored cargo tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd compositor && cargo vendor ../vendor
          cd ..
          tar czf exwm-vr-${VERSION}-vendor.tar.gz vendor

      - name: Create source tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Write the archive outside the working tree first so tar does not
          # observe its own output file changing while it walks ".".
          TMP_TARBALL="/tmp/exwm-vr-${VERSION}.tar.gz"
          tar czf "$TMP_TARBALL" \
            --transform "s,^\.,XoxdWM-${VERSION}," \
            --exclude='.git' --exclude='vendor' \
            --exclude="exwm-vr-${VERSION}-vendor.tar.gz" \
            --exclude="exwm-vr-${VERSION}.tar.gz" \
            .
          mv "$TMP_TARBALL" "exwm-vr-${VERSION}.tar.gz"

      - name: Set up rpmbuild tree
        run: |
          rpmdev-setuptree
          VERSION="${{ steps.version.outputs.version }}"
          cp exwm-vr-${VERSION}.tar.gz ~/rpmbuild/SOURCES/exwm-vr-${VERSION}.tar.gz
          cp exwm-vr-${VERSION}-vendor.tar.gz ~/rpmbuild/SOURCES/exwm-vr-${VERSION}-vendor.tar.gz
          # Copy systemd units
          cp packaging/systemd/exwm-vr-compositor.service ~/rpmbuild/SOURCES/
          cp packaging/systemd/exwm-vr-monado.service ~/rpmbuild/SOURCES/
          cp packaging/systemd/exwm-vr-emacs.service ~/rpmbuild/SOURCES/
          cp packaging/systemd/exwm-vr-brainflow.service ~/rpmbuild/SOURCES/
          cp packaging/systemd/exwm-vr.target ~/rpmbuild/SOURCES/
          # Copy udev rules
          cp packaging/udev/99-exwm-vr.rules ~/rpmbuild/SOURCES/
          # Copy desktop session files
          cp packaging/desktop/exwm-vr.desktop ~/rpmbuild/SOURCES/
          cp packaging/desktop/exwm-vr-session ~/rpmbuild/SOURCES/ 2>/dev/null || true
          cp packaging/desktop/exwm-vr-portals.conf ~/rpmbuild/SOURCES/ 2>/dev/null || true

      - name: Build RPM
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # The native Rocky release lane validates the base compositor package
          # first. Keep Monado integration, SELinux policy hardening, and the
          # BrainFlow BCI venv as separate opt-in builds until the base
          # compositor RPM is proven on named Rocky 10 hosts.
          rpmbuild -bb --nodeps \
            --define "version ${VERSION}" \
            --define "_version ${VERSION}" \
            --without monado_integration \
            --without selinux_policy \
            --without bci \
            packaging/rpm/exwm-vr.spec

      - name: Validate RPM runtime metadata
        run: |
          set -euo pipefail
          RPM=$(find ~/rpmbuild/RPMS -name 'exwm-vr-compositor-*.rpm' | head -1)
          if [ -z "$RPM" ]; then
            echo "No exwm-vr-compositor RPM found in rpmbuild output" >&2
            exit 1
          fi

          mkdir -p /tmp/rpm-validate
          pushd /tmp/rpm-validate >/dev/null
          rpm2cpio "$RPM" | cpio -idmv "./usr/bin/ewwm-compositor" >/dev/null 2>&1
          BIN=usr/bin/ewwm-compositor

          if readelf -l "$BIN" | grep -q '/nix/store'; then
            echo "RPM binary uses a /nix/store ELF interpreter; expected native Rocky runtime linking" >&2
            exit 1
          fi

          if readelf -d "$BIN" | grep -q '/nix/store'; then
            echo "RPM binary embeds a /nix/store RUNPATH; expected native Rocky runtime linking" >&2
            exit 1
          fi

          if rpm -qpR "$RPM" | grep -Fxq 'wayland'; then
            echo "RPM has unresolved bare 'wayland' dependency metadata; expected native Rocky library/runtime package deps" >&2
            exit 1
          fi

          for forbidden in openxr pipewire wireplumber xdg-desktop-portal xdg-desktop-portal-wlr; do
            if rpm -qpR "$RPM" | grep -Fxq "$forbidden"; then
              echo "RPM still hard-requires $forbidden even though the native Rocky lane is non-vr" >&2
              exit 1
            fi
          done

          popd >/dev/null

      - name: Collect RPMs
        run: |
          mkdir -p rpms/
          find ~/rpmbuild/RPMS -name '*.rpm' -exec cp {} rpms/ \;
          ls -la rpms/

      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: 'rpms/*.rpm'

  package-deb:
    name: Package DEB
    needs: build-binary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install FPM
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install fpm

      - uses: actions/download-artifact@v4
        with:
          name: compositor-binaries
          path: dist/

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build DEB
        run: |
          chmod +x dist/result/bin/ewwm-compositor
          fpm -s dir -t deb \
            -n ewwm-compositor \
            -v "${{ steps.version.outputs.version }}" \
            --license "GPL-3.0-or-later" \
            --description "EXWM-VR Wayland compositor" \
            --url "https://github.com/Jesssullivan/XoxdWM" \
            --architecture amd64 \
            --depends libwayland-client0 \
            --depends libegl1 \
            --depends libinput10 \
            --depends libxkbcommon0 \
            dist/result/bin/ewwm-compositor=/usr/bin/ewwm-compositor \
            packaging/systemd/=/usr/lib/systemd/user/ \
            packaging/desktop/exwm-vr.desktop=/usr/share/wayland-sessions/exwm-vr.desktop \
            packaging/udev/99-exwm-vr.rules=/usr/lib/udev/rules.d/99-exwm-vr.rules \
            lisp/core/=/usr/share/emacs/site-lisp/exwm/ \
            lisp/vr/=/usr/share/emacs/site-lisp/exwm-vr/

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: '*.deb'

  release:
    name: Create Release
    needs: [package-rpm, package-deb]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpm-package
          path: packages/

      - uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: packages/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true

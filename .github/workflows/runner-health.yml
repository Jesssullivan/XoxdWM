name: Runner Health Check

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday at 06:00 UTC
    - cron: '0 6 * * 1'

concurrency:
  group: runner-health
  cancel-in-progress: true

jobs:
  nix-runner:
    name: Nix Runner Health
    # Health checks target the shared GloriousFlywheel Nix capability lane only
    # after this repo has proved reachability. Before that, hosted Linux keeps
    # the workflow honest instead of leaving jobs queued without runners.
    #
    # Why GF_SHARED_RUNNERS_REACHABLE is still unset here, measured 2026-08-29:
    #
    #   * `tinyland-nix` runners now exist and are online -- 17 runners in the
    #     tinyland-inc org, including the tinyland-nix-zmgh7 set plus -heavy,
    #     -kvm, -operator and -compute-expansion. The 2026-04-25 finding (zero
    #     tinyland-nix runners; one macOS `xoxd-bates`) is obsolete;
    #     `xoxd-bates` is no longer in the inventory at all.
    #
    #   * But THIS repo is `Jesssullivan/XoxdWM`, owned by a User account, not
    #     by `tinyland-inc`. Organization runner groups can only be shared with
    #     repositories inside that organization, so no value of
    #     GF_SHARED_RUNNERS_REACHABLE can make an org runner pick up a job here.
    #     Setting it to 'true' would not enable the lane, it would strand jobs
    #     on a label nothing serves.
    #
    #   * There is an in-org fork, `tinyland-inc/XoxdWM`, which is eligible by
    #     ownership -- but it is public, and the org's `Default` runner group
    #     (visibility=all) has allows_public=false, while the `tinyland-public`
    #     group (allows_public=true, visibility=selected) lists only
    #     bazel-registry and ci-templates. So the fork is ineligible too, and
    #     the fix there is a runner-group membership decision, not a variable.
    #
    # The blocker is therefore repo ownership plus runner-group membership, not
    # runner supply. Flipping this variable is not the remaining work.
    # Tracked as TIN-592 / XoxdWM#11 / GloriousFlywheel#413.
    runs-on: ${{ vars.USE_SELFHOSTED == 'true' && vars.GF_SHARED_RUNNERS_REACHABLE == 'true' && 'tinyland-nix' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/ensure-nix
        with:
          self_hosted: ${{ vars.USE_SELFHOSTED == 'true' && vars.GF_SHARED_RUNNERS_REACHABLE == 'true' }}
          attic_cache: ${{ env.ATTIC_CACHE || 'main' }}

      - uses: ryanccn/attic-action@v0
        if: env.ATTIC_SERVER != ''
        continue-on-error: true
        with:
          endpoint: ${{ env.ATTIC_SERVER }}
          cache: ${{ env.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Runner info
        run: |
          echo "=== Runner ==="
          echo "Hostname: $(hostname)"
          echo "OS: $(uname -sr)"
          echo "Arch: $(uname -m)"
          echo "CPUs: $(nproc)"
          echo "Memory: $(free -h | awk '/^Mem:/ {print $2}')"
          echo "Disk: $(df -h / | awk 'NR==2 {print $4 " free"}')"

      - name: Nix health
        run: |
          echo "=== Nix ==="
          nix --version
          echo "Store: $(nix path-info --store-dir 2>/dev/null || echo '/nix/store')"
          echo "Trusted: $(nix config show | grep trusted-users || echo 'N/A')"
          nix flake check --no-build

      - name: Attic cache check
        if: env.ATTIC_SERVER != ''
        run: |
          echo "=== Attic ==="
          attic cache info "$ATTIC_CACHE" 2>&1 || echo "Attic cache not reachable"

      - name: Quick devShell smoke
        run: |
          # Keep this bounded. Cache Warming owns the broader package and
          # cache-realization path; the health lane only needs to prove that
          # the default shell still evaluates on the live self-hosted runner.
          nix eval --raw .#devShells.x86_64-linux.default.drvPath >/dev/null

      - name: Elisp package build
        run: nix build .#ewwm-elisp --no-link

  vr-runner:
    name: VR Runner Health
    runs-on: [self-hosted, honey]
    timeout-minutes: 10
    if: vars.USE_SELFHOSTED == 'true' && vars.USE_VR_HARDWARE == 'true'
    steps:
      - name: Runner info
        run: |
          echo "=== VR Runner ==="
          echo "Hostname: $(hostname)"
          echo "OS: $(uname -sr)"
          echo "Arch: $(uname -m)"
          echo "Kernel: $(uname -r)"

      - name: GPU status
        run: |
          echo "=== GPU ==="
          lspci | grep -i vga || echo "No VGA device found"
          ls -la /dev/dri/ || echo "No DRI devices"
          cat /sys/class/drm/card0/device/power_dpm_force_performance_level 2>/dev/null || echo "No AMD power management"

      - name: DRM connectors
        run: |
          echo "=== DRM Connectors ==="
          for conn in /sys/class/drm/card*-*/; do
            name=$(basename "$conn")
            status=$(cat "$conn/status" 2>/dev/null || echo "?")
            non_desktop=$(cat "$conn/non_desktop" 2>/dev/null || echo "?")
            echo "  $name: status=$status non_desktop=$non_desktop"
          done

      - name: Vulkan check
        run: |
          echo "=== Vulkan ==="
          vulkaninfo --summary 2>&1 | head -20 || echo "vulkaninfo not available"

      - name: Monado check
        run: |
          echo "=== Monado ==="
          which monado-cli 2>/dev/null && monado-cli probe 2>&1 || echo "Monado not available"

      - name: USB devices (HMD)
        run: |
          echo "=== USB HMD ==="
          lsusb 2>/dev/null | grep -iE "bigscreen|beyond|valve|htc|meta|pico" || echo "No known HMD USB devices"

name: Multi-Architecture Build & Test

on:
  workflow_dispatch:
  push:
    branches: [main, dev, 'feature/*']
    paths:
      - 'lisp/**'
      - 'test/**'
      - 'compositor/**'
      - 'nix/**'
      - 'flake.nix'
      - 'flake.lock'
  pull_request:
    branches: [main, dev]
    paths:
      - 'lisp/**'
      - 'test/**'
      - 'compositor/**'
      - 'nix/**'
      - 'flake.nix'
      - 'flake.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x86_64:
    name: Build x86_64 (full + VR)
    runs-on: ${{ vars.USE_SELFHOSTED == 'true' && vars.GF_SHARED_RUNNERS_REACHABLE == 'true' && 'tinyland-nix' || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ensure-nix
        with:
          self_hosted: ${{ vars.USE_SELFHOSTED == 'true' && vars.GF_SHARED_RUNNERS_REACHABLE == 'true' }}
          attic_cache: ${{ env.ATTIC_CACHE || 'main' }}
      - uses: ryanccn/attic-action@v0
        if: env.ATTIC_SERVER != ''
        with:
          endpoint: ${{ env.ATTIC_SERVER }}
          cache: ${{ env.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Build compositor (full + VR)
        run: nix build .#packages.x86_64-linux.compositor

      - name: Run cargo tests
        run: |
          nix develop --command bash -c "
            cd compositor
            cargo test --features full-backend,vr
          "

      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache &>/dev/null && sccache --show-stats || echo "sccache not active"

  build-headless:
    name: Build x86_64 (headless)
    runs-on: ${{ vars.USE_SELFHOSTED == 'true' && vars.GF_SHARED_RUNNERS_REACHABLE == 'true' && 'tinyland-nix' || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ensure-nix
        with:
          self_hosted: ${{ vars.USE_SELFHOSTED == 'true' && vars.GF_SHARED_RUNNERS_REACHABLE == 'true' }}
          attic_cache: ${{ env.ATTIC_CACHE || 'main' }}
      - uses: ryanccn/attic-action@v0
        if: env.ATTIC_SERVER != ''
        with:
          endpoint: ${{ env.ATTIC_SERVER }}
          cache: ${{ env.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Build headless compositor
        run: nix build .#packages.x86_64-linux.compositor-headless

      - name: Verify headless binary starts
        run: |
          result/bin/ewwm-compositor --backend headless --headless-exit-after 5 || true

      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache &>/dev/null && sccache --show-stats || echo "sccache not active"

  ert-tests:
    name: ERT Tests
    runs-on: ${{ vars.USE_SELFHOSTED == 'true' && vars.GF_SHARED_RUNNERS_REACHABLE == 'true' && 'tinyland-nix' || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ensure-nix
        with:
          self_hosted: ${{ vars.USE_SELFHOSTED == 'true' && vars.GF_SHARED_RUNNERS_REACHABLE == 'true' }}
          attic_cache: ${{ env.ATTIC_CACHE || 'main' }}
      - uses: ryanccn/attic-action@v0
        if: env.ATTIC_SERVER != ''
        with:
          endpoint: ${{ env.ATTIC_SERVER }}
          cache: ${{ env.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Run ERT test suite
        run: |
          nix develop --command emacs --batch \
            -L lisp/core -L lisp/vr -L lisp/ext \
            -l ert \
            $(find test -name '*-test.el' -printf '-l %p ') \
            -f ert-run-tests-batch-and-exit

  cross-aarch64:
    name: Cross-compile aarch64
    runs-on: ${{ vars.USE_SELFHOSTED == 'true' && vars.GF_SHARED_RUNNERS_REACHABLE == 'true' && 'tinyland-nix' || 'ubuntu-latest' }}
    timeout-minutes: 65
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ensure-nix
        with:
          self_hosted: ${{ vars.USE_SELFHOSTED == 'true' && vars.GF_SHARED_RUNNERS_REACHABLE == 'true' }}
          attic_cache: ${{ env.ATTIC_CACHE || 'main' }}
      - uses: ryanccn/attic-action@v0
        if: env.ATTIC_SERVER != ''
        with:
          endpoint: ${{ env.ATTIC_SERVER }}
          cache: ${{ env.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build aarch64 headless compositor
        id: aarch64_build
        continue-on-error: true
        run: |
          set +e
          timeout 55m nix build .#packages.aarch64-linux.compositor-headless
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Verify binary architecture
        if: steps.aarch64_build.outcome == 'success'
        run: |
          file result/bin/ewwm-compositor | grep -i aarch64

      - name: Note non-blocking aarch64 status
        if: always()
        run: |
          if [ "${{ steps.aarch64_build.outcome }}" != "success" ]; then
            echo "aarch64 cross-build is informational until the shared runner/cache path is fast enough for this secondary target." >> "$GITHUB_STEP_SUMMARY"
            echo "Observed exit code: ${{ steps.aarch64_build.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Treating aarch64 as non-blocking; x86_64 Rocky/runtime proof remains the release-critical lane."
          fi

  cross-s390x:
    name: Cross-compile s390x
    runs-on: ${{ vars.USE_SELFHOSTED == 'true' && vars.GF_SHARED_RUNNERS_REACHABLE == 'true' && 'tinyland-nix' || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ensure-nix
        with:
          self_hosted: ${{ vars.USE_SELFHOSTED == 'true' && vars.GF_SHARED_RUNNERS_REACHABLE == 'true' }}
          attic_cache: ${{ env.ATTIC_CACHE || 'main' }}
      - uses: ryanccn/attic-action@v0
        if: env.ATTIC_SERVER != ''
        with:
          endpoint: ${{ env.ATTIC_SERVER }}
          cache: ${{ env.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build s390x headless compositor
        id: s390x_build
        continue-on-error: true
        run: nix build .#packages.s390x-linux.compositor-headless

      - name: Note non-blocking s390x status
        if: always()
        run: |
          if [ "${{ steps.s390x_build.outcome }}" = "failure" ]; then
            echo "s390x cross-build is informational only: current nixpkgs/LLVM compiler-rt toolchain is failing upstream on s390x." >> "$GITHUB_STEP_SUMMARY"
            echo "Treating s390x as non-blocking until the upstream toolchain issue clears."
          fi

  nix-checks:
    name: NixOS VM integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            system-features = kvm nixos-test
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build ewwm-elisp package
        run: nix build .#ewwm-elisp

      - name: Run boot-test (compositor VM)
        run: nix build .#checks.x86_64-linux.boot-test -L

      - name: Run full-stack-test (compositor + Emacs + home-manager VM)
        run: nix build .#checks.x86_64-linux.full-stack-test -L

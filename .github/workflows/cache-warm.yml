name: Cache Warming

on:
  schedule:
    - cron: '0 4 * * 1'  # Weekly Monday 4 AM UTC
  workflow_dispatch:

jobs:
  warm-nix-cache:
    # Follow the repo's proven self-hosted fast-path label instead of the
    # broader shared-label aspiration, so scheduled maintenance runs can land.
    runs-on: ${{ vars.USE_SELFHOSTED == 'true' && 'xoxdwm-nix' || 'ubuntu-latest' }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        if: vars.USE_SELFHOSTED != 'true'
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: tinyland-inc/GloriousFlywheel/.github/actions/setup-flywheel@main
        if: vars.USE_SELFHOSTED == 'true'
        with:
          attic-cache: ${{ env.ATTIC_CACHE || 'main' }}

      - name: Ensure Nix daemon is reachable
        if: vars.USE_SELFHOSTED == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if nix store ping >/dev/null 2>&1; then
            exit 0
          fi

          echo "::warning::Nix is installed but the daemon socket is unavailable; starting the Nix daemon stack"
          sudo rm -f /nix/var/nix/daemon-socket/socket || true
          if command -v determinate-nixd >/dev/null 2>&1; then
            sudo -b "$(command -v determinate-nixd)" daemon
          else
            NIX_DAEMON_BIN="$(command -v nix-daemon || true)"
            if [ -z "$NIX_DAEMON_BIN" ]; then
              echo "::error::nix-daemon is not on PATH, and nix store ping failed"
              exit 1
            fi
            sudo -b "$NIX_DAEMON_BIN" --daemon
          fi

          for _ in $(seq 1 15); do
            if nix store ping >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done

          echo "::error::nix-daemon did not become reachable after restart"
          exit 1

      - name: Setup Attic
        if: env.ATTIC_SERVER != ''
        uses: ryanccn/attic-action@v0
        continue-on-error: true
        with:
          endpoint: ${{ env.ATTIC_SERVER }}
          cache: ${{ env.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build x86_64 packages
        run: |
          echo "=== Building compositor ==="
          nix build .#compositor --out-link result-compositor || true

          echo "=== Building compositor-headless ==="
          nix build .#compositor-headless --out-link result-headless || true

          echo "=== Building ewwm-elisp ==="
          nix build .#ewwm-elisp --out-link result-elisp || true

          echo "=== Building sway-beyond ==="
          nix build .#sway-beyond --out-link result-sway || true

          echo "=== Building wlroots-beyond ==="
          nix build .#wlroots-beyond --out-link result-wlroots || true

          echo "=== Building kernel-xr ==="
          nix build .#kernel-xr --out-link result-kernel || true

      - name: Push to Attic
        if: env.ATTIC_SERVER != ''
        run: |
          for link in result-compositor result-headless result-elisp result-sway result-wlroots result-kernel; do
            if [ -L "$link" ]; then
              echo "Pushing $link..."
              attic push "$ATTIC_CACHE" "$link" || echo "Warning: failed to push $link"
            fi
          done

      - name: Build cross targets
        if: vars.USE_SELFHOSTED == 'true'
        run: |
          echo "=== Cross-building aarch64 compositor ==="
          nix build .#packages.aarch64-linux.compositor --out-link result-aarch64 || true

          echo "=== Cross-building aarch64 headless ==="
          nix build .#packages.aarch64-linux.compositor-headless --out-link result-aarch64-headless || true

          echo "=== Cross-building s390x headless ==="
          nix build .#packages.s390x-linux.compositor-headless --out-link result-s390x || true

      - name: Push cross targets to Attic
        if: env.ATTIC_SERVER != '' && vars.USE_SELFHOSTED == 'true'
        run: |
          for link in result-aarch64 result-aarch64-headless result-s390x; do
            if [ -L "$link" ]; then
              echo "Pushing $link..."
              attic push "$ATTIC_CACHE" "$link" || echo "Warning: failed to push $link"
            fi
          done
